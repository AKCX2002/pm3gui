name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pm3gui-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
          - platform: windows-x64
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libglib2.0-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        if: runner.os == 'Linux'
        run: flutter analyze --no-fatal-infos

      - name: Test
        if: runner.os == 'Linux'
        run: flutter test --no-pub

      - name: Build Linux
        if: runner.os == 'Linux'
        run: flutter build linux --release --no-pub

      - name: Build Windows
        if: runner.os == 'Windows'
        run: flutter build windows --release --no-pub

      - name: Package Linux release
        if: github.ref_type == 'tag' && runner.os == 'Linux'
        run: >-
          tar -C build/linux/x64/release/bundle -czf
          "pm3gui-${GITHUB_REF_NAME}-linux-x64.tar.gz" .

      - name: Package Windows release
        if: github.ref_type == 'tag' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "pm3gui-$env:GITHUB_REF_NAME-windows-x64.zip"
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath $archive

      - name: Upload release artifact
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: pm3gui-${{ github.ref_name }}-${{ matrix.platform }}
          path: pm3gui-${{ github.ref_name }}-${{ matrix.platform }}.*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.0
        with:
          generate_release_notes: true
          files: artifacts/*
