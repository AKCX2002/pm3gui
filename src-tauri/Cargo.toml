[package]
name = "pm3gui-tauri"
version = "0.1.0"
description = "PM3 GUI - A modern Proxmark3 client"
authors = ["PM3GUI Contributors"]
edition = "2021"

[lib]
name = "pm3gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
serialport = "4"
regex = "1"
